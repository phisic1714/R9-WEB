user nginx;
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /var/log/nginx/error.log;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /etc/nginx/html;
        index index.html;

        # LIFF loads LINE scripts and calls LINE APIs during initialization.
        set $csp "default-src 'self';";
        set $csp "${csp} script-src 'self' https://*.line-scdn.net https://static.cloudflareinsights.com;";
        set $csp "${csp} style-src 'self';";
        set $csp "${csp} img-src 'self' data: blob: https://*.line-scdn.net;";
        set $csp "${csp} font-src 'self' data:;";
        set $csp "${csp} connect-src 'self' https://*.line.me https://*.line-scdn.net https://cloudflareinsights.com;";
        set $csp "${csp} object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://access.line.me;";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;

        location /assets/ {
            try_files $uri =404;
        }

        # Root deployment preserves the current LINE Endpoint URL.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # CMS/ERP-style deployment. Build with VITE_BASE_PATH=/r9/web/.
        location = /r9/web {
            return 308 /r9/web/$is_args$args;
        }

        location /r9/web/assets/ {
            alias /etc/nginx/html/assets/;
        }

        location /r9/web/ {
            alias /etc/nginx/html/;
            index index.html;
            try_files $uri $uri/ /r9/web/index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
