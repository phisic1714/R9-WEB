# Include inside the existing HTTPS server block for the Endpoint domain.
# Build with VITE_BASE_PATH=/r9/.
# Copy the CONTENTS of dist/ into /var/www/r9/.
location = /r9 {
    return 308 /r9/$is_args$args;
}

location ^~ /r9/assets/ {
    root /var/www;
    try_files $uri =404;
}

location /r9/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /r9/index.html;
}
